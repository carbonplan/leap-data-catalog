- id: ostia
  title: OSTIA Sea Surface Temperature
  summary: Daily, gap-free 0.05° global sea surface temperature and sea ice from the UK Met Office, 1982 to 2023.
  description:
    A daily, gap-free analysis of global foundation sea surface temperature and sea ice concentration
    on a 0.05° grid, made by the UK Met Office with its OSTIA system. Optimal interpolation combines data from more
    than 25 satellite sensors with in situ measurements. This is the reprocessed version, made for climate work;
    the published evaluation puts it within a target accuracy of 0.1 K and finds a possible cool bias after the
    1991 Pinatubo eruption. It comes with an estimated error for each value and a land, sea, lake and ice mask.
    LEAP holds the version distributed by NASA PO.DAAC as one Zarr store, 1982 through 2023. Temperatures are in
    kelvin.
  source_url: https://github.com/leap-stc/OSTIA_REP
  license: other
  license_text: Open data, no restrictions (NASA EOSDIS)
  license_url: https://www.earthdata.nasa.gov/data/catalog/pocloud-ostia-ukmo-l4-glob-rep-v2.0-2.0
  providers:
    - name: UK Met Office
      roles:
        - producer
      url: https://www.metoffice.gov.uk
    - name: NASA PO.DAAC
      roles:
        - host
      url: https://podaac.jpl.nasa.gov
