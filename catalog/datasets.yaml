  summary: Daily reference evapotranspiration (0.01°) and maximum temperature (0.1°) for Peru.
  description:
    "Two daily gridded datasets for Peru built from weather station records that were quality controlled,
    gap-filled, homogenised and interpolated. PISCOeo_pm is reference evapotranspiration from the FAO Penman-Monteith
    equation, 1981 to 2016 at 0.01°; the paper finds it more precise on average than CRU_TS, TerraClimate and ERA5-Land.
