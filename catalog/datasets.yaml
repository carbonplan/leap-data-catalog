- id: cm26-control
  title: GFDL CM2.6 Control Run
  summary: >-
    Daily ocean surface and atmosphere output from a preindustrial run of a climate model with a 0.1° ocean.
  description: >-
    Output from the preindustrial control run of GFDL CM2.6, a coupled climate model whose 0.1° ocean grid
    resolves mesoscale eddies, with the miniBLING ocean biogeochemistry model. The ocean store has daily
    surface temperature, salinity, currents, sea level and biogeochemistry for model years 181 to 200. The
    atmosphere store has daily fields on a 0.5° x 0.625° grid for model years 120 to 200. Years are model
    years, not calendar dates. The stores do not name the forcing; preindustrial is how the CM2-O-miniBLING
    control is described elsewhere.
  source_url: https://github.com/leap-stc/cm2o_feedstock
  spatial_resolution: 0.1° ocean, 0.5° x 0.625° atmosphere
