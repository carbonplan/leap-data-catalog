- id: llc4320-agulhas
  title: LLC4320 Regional Ocean Simulation
  summary: 12-hourly 3D ocean fields at 1/48° for one region of the global LLC4320 simulation, 2011 to 2012.
  description:
    "One region of LLC4320, a global ocean simulation at 1/48° run with MITgcm at NASA JPL by Dimitris
    Menemenlis. Fields are 12-hourly averages from September 2011 to November 2012 for the top 690 m (45 levels):
    temperature, salinity, three velocity components, boundary layer depth, surface heat flux and wind stress. It
    is one of 12 regions prepared to study ocean submesoscale mixing; a paper used all 12 to train a neural network
    for vertical buoyancy fluxes. The region is named Agulhas in the source, but its coordinates cover 125°W to
    110°W, 55°S to 40°S, in the southeast Pacific. Check the location before use. The grid is the model's own curvilinear
    grid. The original Zarr chunks are read in place."
  source_url: https://github.com/leap-stc/LLC4320_12h_3D-regions_feedstock
  spatial_domain: Southeast Pacific (labelled Agulhas)
  coverage: regional
