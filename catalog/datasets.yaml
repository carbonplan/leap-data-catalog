- id: corrdiff-nyc
  title: CorrDiff NYC Downscaling Data
  summary:
    ERA5 and HRRR training data plus CorrDiff inputs, targets and outputs on a 128 x 128 grid around New
    York City.
  description:
    'Training data and results from experiments that downscale ERA5 over the New York City region with
    CorrDiff, a generative diffusion model first demonstrated over Taiwan. The store has 46 groups, each one hourly
    year or part of one on a 128 x 128 grid: ERA5 fields interpolated to the HRRR grid, HRRR reference fields (temperature,
    wind, precipitation and radar reflectivity), model inputs, targets and generated outputs. Outputs have an extra
    dimension of 3 or 10 generated samples. The 1945 to 2005 groups use one year per decade. The code on this page
    opens one group at a time; change the group name to open another, such as input_1945. Groups ending in 2021_1
    and 2021_2 are partial copies of the 2021 data. The original NetCDF files are read in place.'
  source_url: https://github.com/leap-stc/corrdiff_feedstock
  spatial_domain: New York City
  coverage: regional
  time_resolution: hourly
  license: Apache-2.0
  providers:
