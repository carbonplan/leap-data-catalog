- id: metaflux
  title: MetaFlux Global Carbon Fluxes
  summary: >-
    Daily and monthly 0.25° plant carbon uptake (GPP) and ecosystem respiration, 2001 to 2021.
  description: >-
    Global gross primary production (carbon taken up by plants) and ecosystem respiration at 0.25°, daily and
    monthly from 2001 to 2021. An ensemble of neural networks is trained on 206 FLUXNET2015 tower sites with a
    meta-learning method meant for places with few measurements, such as the tropics and drylands. Inputs are
    ERA5 weather and MODIS leaf area and vegetation index. Each flux comes as the ensemble mean and the
    ensemble spread (variables ending in _std). The daily and monthly stores use different names for latitude
    and longitude.
