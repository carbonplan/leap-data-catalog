- id: ldeo-hpd
  title: LDEO-HPD Surface Ocean pCO2
  summary: >-
    Monthly 1° surface ocean CO2 and air-sea CO2 flux from machine-learning-corrected ocean models, 1959 to
    2022.
  description: >-
    LDEO-HPD (Lamont-Doherty Earth Observatory Hybrid Physics Data) estimates surface ocean CO2 and air-sea
    CO2 exchange on a monthly 1° grid. A gradient boosting model learns the mismatch between ocean
    biogeochemical models and observations, then corrects the model fields everywhere. Before 1982, when
    observations are sparse, the correction is a climatology of the mismatches. The monthly store covers 1959
    to 2022. The annual store, 1990 to 2018, holds both measured and reconstructed values. The flux is
    positive into the ocean. This copy was made for LEAP's ocean carbon sink data story.
  source_url: https://github.com/carbonplan/ocean-carbon-sink-data-feedstock
  license: CC-BY-4.0
  providers:
    - name: Lamont-Doherty Earth Observatory
      roles:
        - producer
        - licensor
      url: https://lamont.columbia.edu
    - name: LEAP
      roles:
        - producer
        - licensor
      url: https://leap.columbia.edu
  maintainers:
    - name: Anderson Banihirwe
      github: andersy005
  references:
    - title: LDEO-HPD method (Gloege et al., 2022)
      href: https://doi.org/10.1029/2021MS002620
      rel: cite-as
    - title: LDEO-HPD extension to 1959 (Bennington et al., 2022)
      href: https://doi.org/10.1029/2022GL098632
      rel: cite-as
    - title: LDEO-HPD back in time data (Zenodo)
      href: https://doi.org/10.5281/zenodo.13891722
    - title: LDEO product page
      href: https://oceancarbon.ldeo.columbia.edu/content/ldeo-hpd
    - title: Ocean carbon sink data story
      href: https://stories.leap.columbia.edu/ocean-sink
  domain:
    - carbon
    - ocean
  kind:
    - observations
  labels:
    fgco2: Air-sea CO2 flux, positive into the ocean
  stores:
    - key: monthly
      name: Monthly pCO2 and air-sea flux
      href: s3://carbonplan-data-viewer/demo/leap-data-stories/GCB-2023_dataprod_LDEO-HPD_1959-2022-updated-flipped-lon.zarr
      format: zarr
    - key: annual
      name: Annual pCO2
      href: s3://carbonplan-data-viewer/demo/leap-data-stories/annual-sfco2.zarr
