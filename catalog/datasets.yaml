- id: ldeo-pco2-hpd-back-in-time-flux
  title: LDEO-pCO2 HPD Back in Time (flux)
  description: The ocean reduces human impact on the climate by absorbing and sequestering CO2 . From
    1950s to the 1980s, observations of pCO2 and related ocean carbon variables were sparse and uncertain.
    Thus, global ocean biogeochemical models (GOBMs) have been the basis for quantifying the ocean carbon
    sink. The LDEO-Hybrid Physics Data product (LDEO-HPD) interpolates sparse surface ocean pCO2 data
    to global coverage by using GOBMs as priors, and applying machine learning to estimate full-coverage
    corrections.
  license: CC BY
  providers:
  - LDEO
  - LEAP
  tags: &id001
  - ocean
  - carbon
  - zarr
  - machine learning
  href: s3://carbonplan-data-viewer/demo/leap-data-stories/GCB-2023_dataprod_LDEO-HPD_1959-2022-updated-flipped-lon.zarr
  format: zarr
