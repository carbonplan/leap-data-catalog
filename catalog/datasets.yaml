  summary: >-
    Twice-monthly 0.05° proxy for plant photosynthesis from calibrated AVHRR reflectance, 1982 to 2023.
  description: >-
    LCSPP-AVHRR version 3.2 is a proxy for plant photosynthesis at 0.05°, two values per month from 1982 to
    2023, split after day 15. A neural network trained on OCO-2 solar-induced fluorescence (SIF) is applied to
    AVHRR reflectance calibrated against MODIS. The store has instantaneous and daily clear-sky values,
    all-sky daily values weighted by ERA5 sunlight, and a quality flag. The authors advise using only observed
    (flag 0) and high-quality gap-filled (flag 1) values, and say not to treat it as measured SIF or use it to
    estimate fluorescence yield.
