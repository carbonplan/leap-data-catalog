- id: climsim-lowres
  title: ClimSim Low-Resolution Inputs
  summary: 'Machine learning inputs from a multi-scale climate simulation: 384 columns every 20 minutes for 8 years.'
  description:
    "Model state from ClimSim, a dataset for training machine learning emulators of the small-scale physics
    inside a multi-scale climate model. This is the low-resolution version: 384 atmospheric columns with 60 levels,
    every 20 minutes, over 8 model years. Variables cover temperature, humidity, cloud water and ice, winds, surface
    pressure, solar input, surface fluxes and trace gases. LEAP's copy merges the input files (called mli) into
    one store. It does not include the matching output files needed as training targets; get those from the original
    on Hugging Face. The grid is unstructured, so columns have an index (ncol) and no latitude or longitude here.
    The calendar has no leap days and the years are model years."
  source_url: https://github.com/leap-stc/climsim_feedstock
  coverage: global
