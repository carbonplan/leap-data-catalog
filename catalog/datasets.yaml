- id: grace-tws
  title: GRACE Land Water Storage Anomalies
  summary: >-
    Monthly 1° land water storage anomalies from the GRACE satellites, 2002 to 2017.
  description: >-
    Monthly changes in water stored on land, in meters of equivalent water thickness, from the GRACE satellite
    gravity mission. This is the JPL RL06 version 04 land product at 1°, relative to the 2005 to 2010 mean,
    with an uncertainty field. Stripes are removed and a 300 km smoothing filter is applied. Filtering weakens
    the signal; the cited paper corrects for this with gridded gain factors, which are not in this store. It
