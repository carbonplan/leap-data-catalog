- id: metaflux
  title: MetaFlux Global Carbon Fluxes
  summary: Daily and monthly 0.25° plant carbon uptake (GPP) and ecosystem respiration, 2001 to 2021.
  description:
    Global gross primary production (carbon taken up by plants) and ecosystem respiration at 0.25°, daily
    and monthly from 2001 to 2021. The authors train an ensemble of neural networks on 206 FLUXNET2015 tower sites,
    with a meta-learning method meant for places with few measurements such as the tropics and drylands. Inputs
    are ERA5 precipitation, vapor pressure deficit and air temperature, and MODIS leaf area and vegetation index.
    Each flux comes with the ensemble mean and the ensemble spread (variables ending in _std), in grams of carbon
    per square metre per day. The paper reports 5 to 7% lower validation error than the same networks without meta-learning.
    LEAP stores the daily and monthly data separately; their latitude and longitude names differ.
  source_url: https://github.com/leap-stc/metaflux_feedstock
  license: CC-BY-4.0
  providers:
    - name: Nathaniel et al.
