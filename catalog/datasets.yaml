# LEAP data catalog source. One entry per dataset; each store becomes a STAC asset.
# Dates, bbox, resolution and variables come from metadata.json (scripts/enrich_datasets.py) unless set here.
# `labels` and `units` replace those of a variable in every store of the dataset; the stores are unchanged.
# Build: uv run scripts/build_catalog.py --out catalog.parquet
- id: corrdiff-nyc
  title: CorrDiff NYC Downscaling Data
  summary: >-
    Hourly ERA5 and HRRR fields with CorrDiff inputs, targets and outputs for the New York City region.
  description: >-
    Training data and results from experiments that downscale ERA5 over the New York City region with
    CorrDiff, a generative diffusion model. The store has 46 hourly groups on a 128 x 128 grid: ERA5 fields
    interpolated to the HRRR grid, HRRR reference fields, and model inputs, targets and outputs. Each group
    covers one year or part of one; the 1945 to 2005 groups use one year per decade, and groups ending in
    2021_1 and 2021_2 are partial copies of 2021. Outputs have an extra dimension of 3 or 10 generated
    samples. The code on this page opens one group; change the group name for another, such as input_1945. The
    original NetCDF files are read in place.
  source_url: https://github.com/leap-stc/corrdiff_feedstock
  spatial_domain: New York City
  coverage: regional
  time_resolution: hourly
  license: Apache-2.0
  providers:
    - name: LEAP
      roles:
        - processor
      url: https://leap.columbia.edu
  maintainers:
    - name: Sarika de Bruyn
      github: sarika-debruyn
  references:
    - title: Feedstock README
      href: https://github.com/leap-stc/corrdiff_feedstock
    - title: CorrDiff paper (Mardani et al., 2025)
      href: https://doi.org/10.1038/s43247-025-02042-5
  domain:
    - atmosphere
  kind:
    - ML-ready
  start: '1945-01-01T00:00:00Z'
  end: '2025-11-21T23:00:00Z'
  bbox:
    - -76.4429
    - 38.6794
    - -70.9166
    - 42.8623
  labels:
    '10m_u_component_of_wind': '10 m U wind component'
    '10m_v_component_of_wind': '10 m V wind component'
    '2m_temperature': '2 m temperature'
    geopotential_500: Geopotential at 500 hPa
    geopotential_850: Geopotential at 850 hPa
    refc: Composite radar reflectivity
    t2m: '2 m temperature'
    temperature_500: Temperature at 500 hPa
    temperature_850: Temperature at 850 hPa
    total_column_water_vapour: Total column water vapor
    total_precipitation: Total precipitation
    tp: Total precipitation
    u10: '10 m U wind component'
    u_component_of_wind_500: U component of wind at 500 hPa
    u_component_of_wind_850: U component of wind at 850 hPa
    v10: '10 m V wind component'
    v_component_of_wind_500: V component of wind at 500 hPa
    v_component_of_wind_850: V component of wind at 850 hPa
  stores:
