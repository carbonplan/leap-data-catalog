- id: pco2-testbed
  title: Large Ensemble pCO2 Testbed
  summary: >-
    Ocean CO2 from three Earth system model ensembles, sampled like real observations, to test
    reconstructions.
  description: >-
    A testbed for methods that fill gaps in sparse ocean CO2 observations. Monthly surface fields from three
    Earth system model ensembles, at 1° from 1982 to early 2017, come with copies sampled where and when the
    SOCAT observations were made (variables ending in _socat), so a reconstruction can be scored everywhere.
    There is one store each for CESM (24 members), CanESM2 (25) and GFDL ESM2M (24); the published testbed has
    25 members of each of four models. All three have pCO2, sea surface temperature and salinity, mixed layer
    depth, chlorophyll, wind and sea ice; only CESM has the air-sea CO2 flux. The CanESM2 files also carry the
    CCCma data license.
  source_url: https://github.com/leap-stc/large-ensemble-pCO2-testbed-feedstock
  license: CC-BY-4.0
  providers:
    - name: Gloege et al.
      roles:
        - producer
        - licensor
      url: https://doi.org/10.6084/m9.figshare.c.4568555
    - name: LEAP
      roles:
        - processor
      url: https://leap.columbia.edu
  maintainers:
    - name: Julius Busecke
      github: jbusecke
  references:
    - title: pCO2 testbed paper (Gloege et al., 2021)
      href: https://doi.org/10.1029/2020GB006788
      rel: cite-as
    - title: pCO2 testbed data (figshare)
      href: https://doi.org/10.6084/m9.figshare.c.4568555
      rel: cite-as
