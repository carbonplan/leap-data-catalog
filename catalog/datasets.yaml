- id: ceres-ebaf
  title: CERES EBAF Radiation Budget
  summary: >-
    Monthly 1° radiation fluxes at the top of the atmosphere and the surface, with cloud properties, from
    2000.
  description: >-
    Satellite estimates of the energy entering and leaving Earth: shortwave and longwave fluxes at the top of
    the atmosphere and the surface, cloud radiative effects and cloud properties, monthly at 1°. This is CERES
    EBAF (Energy Balanced and Filled) Edition 4.2.1 from NASA Langley. LEAP's copy covers March 2000 to March
    2026 and adds albedo, emission and skin temperatures, climatologies, annual means and a whole-record mean,
    each averaging period in its own group. The data for 2000 and 2026 cover only part of the year. Clear-sky
    fluxes come in two versions: for the cloud-free areas of each cell and for the whole cell.
  source_url: https://github.com/carbonplan/LEAP-atm-flux-data-viewer
  license: other
  license_text: Open data, no restrictions (NASA EOSDIS)
  license_url: https://www.earthdata.nasa.gov/data/catalog/larc-cloud-ceres-ebaf-edition4.2.1-0
