- id: ostia
  title: OSTIA Sea Surface Temperature
  summary: >-
    Daily, gap-free 0.05° global sea surface temperature and sea ice from the UK Met Office, 1982 to 2023.
  description: >-
    A daily, gap-free analysis of global foundation sea surface temperature and sea ice concentration at
    0.05°, made by the UK Met Office from more than 25 satellite sensors and in situ measurements. This is the
    reprocessed version, made for climate work; the published evaluation finds a possible cool bias after the
    1991 Pinatubo eruption. LEAP's copy is one Zarr store of the version distributed by NASA PO.DAAC, 1982 to
    2023. Temperatures are in kelvin, each with an estimated error, and a mask marks land, sea, lake and ice.
