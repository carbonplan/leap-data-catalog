- id: nasa-rasi
  title: NASA RASI Land Hydrology Projections
  summary: >-
    Monthly 0.1° percentiles of soil moisture, runoff and snow for the south-central US, 1950 to 2099.
  description: >-
    Monthly land hydrology at 0.1° over the south-central United States and northern Mexico, from NASA RASI
    (Risk Analysis and Solutions Innovators). Each variable is stored as five percentiles: root zone soil
    moisture, surface and subsurface runoff, snow water, snow depth and snowfall, surface temperature and
    precipitation. NASA project slides tie RASI to its Land Information System; no paper describing this
    dataset was found. There is one store for 1950 to 2014 and one each for SSP2-4.5 (2015 to 2099) and
    SSP5-8.5 (2015 to 2096). The stores were made by Development Seed and reference the original files in a
    public NASA bucket.
