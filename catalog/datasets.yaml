- id: lcspp-avhrr
  title: LCSPP-AVHRR Photosynthesis Proxy
  summary: 0.05° twice-monthly proxy for plant photosynthesis from calibrated AVHRR reflectance, 1982 to 2023.
  description:
    LCSPP-AVHRR version 3.2 is a long record of plant photosynthetic activity at 0.05°, two values per
    month from 1982 to 2023. AVHRR surface reflectance is calibrated against MODIS, and a neural network trained
    on OCO-2 solar-induced fluorescence (SIF) turns it into a proxy for photosynthesis. The store has instantaneous
    and daily clear-sky values, all-sky daily values weighted by ERA5 sunlight, and a quality flag. The authors
    advise using only observed (flag 0) and high-quality gap-filled (flag 1) values. They also say not to treat
    it as measured SIF, and that it does not suit estimates of fluorescence yield. A companion MODIS version shows
    a stronger greening trend after 2001. Each month is split at day 15.
