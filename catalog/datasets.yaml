- id: llc4320-agulhas
  title: LLC4320 Ocean Simulation
  summary: Kilometer-scale MITgcm LLC4320 global ocean simulation, 12-hourly averaged 3D regional cutouts.
  description:
    "The LLC4320 is an ocean only simulation forced by 6 hourly atmospheric fields, \nwhich was run at\
    \ NASA JPL by Dimitris Menemenlis. These are 12 hourly averaged \nfields for from 12 different regions in the\
    \ ocean, each roughly 10degrees by \n10degrees in size, for the top 700m of the water column. There five 3D\
    \ variables: \nTemperature, Salinity, and 3 components of velocity, and four 2D surface fields:\nBoundary layer\
    \ depth, surface heat flux, and 2 components of wind stress.\nNote that this is a small part of the original\
    \ dataset which has been processed and \nsub-sampled to make the size more manageable."
  source_url: https://github.com/leap-stc/LLC4320_12h_3D-regions_feedstock
