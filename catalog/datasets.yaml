- id: era5
  title: ERA5 Reanalysis
  summary: >-
    ECMWF hourly global reanalysis at 0.25° from 1940, on single, pressure and model levels.
  description: >-
    ERA5 is the ECMWF global reanalysis of the atmosphere, land surface and ocean waves, produced for the
    Copernicus Climate Change Service. This entry links to the analysis-ready hourly 0.25° copy in Google
    Research's ARCO-ERA5 project. One store has 273 surface and pressure-level variables on 37 levels; the
    other has 14 variables on 137 model levels. The time axis runs from 1900 to 2050, but data exist only
    between the store attributes valid_time_start (1940-01-01) and valid_time_stop. Final data arrive about
    three months behind real time, and preliminary ERA5T data sooner (valid_time_stop_era5t).
  source_url: https://github.com/leap-stc/arco-era5_feedstock
  license: CC-BY-4.0
  providers:
    - name: ECMWF
      roles:
        - producer
        - licensor
      url: https://www.ecmwf.int
    - name: Google Research
      roles:
        - processor
        - host
      url: https://github.com/google-research/arco-era5
  maintainers:
    - name: Julius Busecke
      github: jbusecke
  references:
    - title: ARCO-ERA5 project
      href: https://github.com/google-research/arco-era5
    - title: ERA5 paper (Hersbach et al., 2020)
      href: https://doi.org/10.1002/qj.3803
      rel: cite-as
    - title: ERA5 hourly data (Copernicus Climate Data Store)
      href: https://doi.org/10.24381/cds.adbb2d47
