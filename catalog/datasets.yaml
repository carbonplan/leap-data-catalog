- id: pisco
  title: PISCO Peru Evapotranspiration and Temperature
  summary: >-
    Daily reference evapotranspiration (0.01°) and maximum temperature (0.1°) for Peru.
  description: >-
    Two daily gridded datasets for Peru, built from quality-controlled, gap-filled weather station records.
    PISCOeo_pm is reference evapotranspiration from the FAO Penman-Monteith equation, 1981 to 2016 at 0.01°.
    PISCOt v1.2 is air temperature, 1981 to 2020; the paper gives a mean absolute error of 1.4 °C for daily
    maximum temperature. LEAP's copy has one store for evapotranspiration and one for maximum temperature
    only, at 0.1° rather than the published 0.01°.
