- id: gpcp-daily
  title: GPCP Daily Precipitation
  summary: Daily 1° global precipitation merged from satellites and rain gauges, 1996 to early 2025.
  description:
    "The Global Precipitation Climatology Project daily climate data record, version 1.3: global precipitation
    in mm per day on a 1° grid, merged from satellite estimates and rain gauges. It is made at the University of
    Maryland and published by NOAA NCEI, and is used to study rainfall variability and to evaluate models. LEAP's
    copy combines the daily files into one Icechunk store from 1 October 1996 to 28 February 2025 and is not extended
