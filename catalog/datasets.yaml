- id: pco2-testbed
  title: Large Ensemble pCO2 Testbed
  summary: Ocean CO2 from three Earth system model ensembles, sampled like real observations, to test reconstructions.
  description:
    "A testbed for methods that fill in sparse ocean CO2 observations. Monthly surface fields from large
    ensembles of Earth system models, on a 1° grid from 1982 to early 2017, come with copies sampled where and when
    the SOCAT observations were made (variables ending in _socat). Because the full model field is known, a reconstruction
    from the samples can be scored everywhere. The published testbed used 25 members of each of four models; LEAP's
    copy has three: CESM (24 members), CanESM2 (25) and GFDL ESM2M (24). Each model has its own store, with CO2
    flux, sea surface temperature, salinity, mixed layer depth and chlorophyll among its variables. The CanESM2
    files also carry the CCCma data licence."
  source_url: https://github.com/leap-stc/large-ensemble-pCO2-testbed-feedstock
  license: CC-BY-4.0
