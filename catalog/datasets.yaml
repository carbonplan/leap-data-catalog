- id: cm26-control
  title: GFDL CM2.6 Control Run
  summary: Daily surface ocean and atmosphere output from a coupled climate model with a 0.1° ocean.
  description:
    Output from a control run of GFDL CM2.6, the highest-resolution member of the CM2-O family of coupled
    climate models. Its 0.1° ocean grid resolves mesoscale eddies, and the models were built to study how ocean
    resolution changes heat transport. This run carries miniBLING, a reduced ocean biogeochemistry model with three
    tracers. The ocean store has daily surface temperature, salinity, currents, sea level and biogeochemistry (chlorophyll,
    carbon, oxygen and phosphate) for model years 181 to 200. The atmosphere store has daily fields on a 0.5° latitude
    grid for model years 120 to 200. Years are model years, not calendar dates. The store titles do not state the
    forcing; the CM2-O paper describes runs with constant 1990 forcing.
  source_url: https://github.com/leap-stc/cm2o_feedstock
  spatial_resolution: 0.1° ocean, 0.5° atmosphere
  license: other
  license_text: Unknown
  providers:
