- id: glad-lclu
  title: GLAD Land Cover and Land Use Change
  summary: >-
    30 m global land cover and land use from Landsat, every 5 years from 2000 to 2020.
  description: >-
    Global maps of land cover and land use at 30 m from the Landsat archive, made by the GLAD group at the
    University of Maryland: forest extent and height, cropland, built-up land, surface water, and perennial
    snow and ice. Accuracy is above 85% for every theme except built-up land, which the producers call
    provisional. Forest includes trees outside forests, unlike the FAO definition, and cropland leaves out
    tree crops and shifting cultivation. This copy, a sample Icechunk dataset hosted by Earthmover, has five
    maps from 2000 to 2020 for 60°S to 80°N.
  source_url: https://glad.umd.edu/dataset/GLCLUC2020
  coverage: global
  spatial_resolution: 30 m
  time_resolution: 5 years
  license: CC-BY-4.0
  providers:
