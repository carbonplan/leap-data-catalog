- id: ldeo-hpd
  title: LDEO-HPD Surface Ocean pCO2
  summary: Surface ocean CO2 and air-sea CO2 flux from machine learning corrections to ocean models, 1959 to 2022.
  description:
    LDEO-Hybrid Physics Data estimates surface ocean CO2 and the exchange of CO2 between the sea and
    the air on a monthly 1° grid. It starts from global ocean biogeochemical models and trains a gradient boosting
    model on the mismatch between those models and observations, then uses it to correct the model fields everywhere.
    Before 1982, when observations are sparse, the correction is a climatology of the mismatches. The paper reports
    better agreement with independent observations than other data-based products. The monthly store covers 1959
    to 2022. The annual store, 1990 to 2018, holds both measured and reconstructed values. LEAP serves the copy
    made for its ocean carbon sink data story. The flux is positive into the ocean.
  source_url: https://github.com/carbonplan/ocean-carbon-sink-data-feedstock
  license: other
  license_text: CC BY
  providers:
    - name: Lamont-Doherty Earth Observatory
      roles:
        - producer
        - licensor
      url: https://lamont.columbia.edu
    - name: LEAP
      roles:
        - producer
        - licensor
      url: https://leap.columbia.edu
  maintainers:
    - name: Anderson Banihirwe
      github: andersy005
  references:
    - title: Method (Gloege et al., 2022)
      href: https://doi.org/10.1029/2021MS002620
      rel: cite-as
    - title: Extension to 1959 (Bennington et al., 2022)
      href: https://doi.org/10.1029/2022GL098632
      rel: cite-as
    - title: LDEO product page
      href: https://oceancarbon.ldeo.columbia.edu/content/ldeo-hpd
    - title: Ocean carbon sink data story
      href: https://stories.leap.columbia.edu/ocean-sink
  domain:
    - carbon
    - ocean
  kind:
    - observations
  stores:
