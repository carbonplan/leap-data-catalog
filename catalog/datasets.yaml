    2002 to 2020 on a global 25 km EASE-2 grid. Neural networks learn to reproduce NASA SMAP soil moisture from
    SMOS and AMSR-E/2 brightness temperatures, which extends the SMAP record 13 years before its launch. The seasonal
    cycle is removed for training so that the networks focus on extremes. Compared with 367 ground stations the
