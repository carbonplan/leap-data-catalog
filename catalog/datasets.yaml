- id: era5
  title: ERA5 Reanalysis
  summary: ECMWF hourly global reanalysis at 0.25° from 1940, on single, pressure and model levels.
  description:
    ERA5 is the ECMWF global reanalysis of the atmosphere, land surface and ocean waves, produced for
    the Copernicus Climate Change Service. This is the analysis-ready Zarr copy that Google Research keeps in the
    ARCO-ERA5 project, hourly at 0.25°. One store has 273 surface and pressure-level variables on 37 levels; the
    other has 14 variables on 137 model levels. The time axis is allocated from 1900 to 2050, but data exist only
    between the store attributes valid_time_start (1940-01-01) and valid_time_stop. Google updates the final data
    about once a month with a delay of three months, and adds the preliminary ERA5T data sooner (valid_time_stop_era5t).
    LEAP links to this copy and does not change it.
  source_url: https://github.com/leap-stc/arco-era5_feedstock
