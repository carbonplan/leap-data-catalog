- id: gotm
  title: GOTM Ocean Mixing Training Data
  summary: General Ocean Turbulence Model output for training neural networks of ocean boundary layer mixing.
  description:
    'Training data behind a neural network that predicts how strongly turbulence mixes the ocean surface
    boundary layer. It comes from a second-moment turbulence closure run in the General Ocean Turbulence Model (GOTM),
    and the paper uses the network to replace an ad hoc part of a mixing scheme in an ocean general circulation
    model. Each sample has forcing (wind stress, heat flux, latitude and related terms) and a 16-point vertical
    profile. The raw store has 2.5 million samples. The shape function (SF) store has 1.3 million: boundary layer
    depths are adjusted and samples limited to heat flux below 610 W/m2, wind stress up to 1.2 N/m2 and layer depth
    between 5 and 750 m. There is no map grid or calendar time. Extra test data are in a text file linked on this
    page.'
  source_url: https://github.com/leap-stc/GOTM
  license: CC-BY-4.0
  providers:
