- id: chirps-daily
  title: CHIRPS Daily Precipitation
  summary: >-
    Daily 0.05° rainfall for 50°S to 50°N from infrared satellite data and rain gauges, 1981 to 2024.
  description: >-
    CHIRPS (Climate Hazards Center InfraRed Precipitation with Station data) version 2.0: daily rainfall at
    0.05° between 50°S and 50°N, made by the UC Santa Barbara Climate Hazards Center with the US Geological
    Survey for drought monitoring. It combines a rainfall climatology, infrared observations of cold clouds
    and station data. The producer notes that satellite-only estimates are biased in complex terrain and that
