- id: nex-gddp-cmip6-virtual
  title: NASA NEX-GDDP-CMIP6 Climate Projections
  summary: >-
    Daily 0.25° CMIP6 climate projections, bias-corrected and downscaled by NASA, 1950 to 2100.
  description: >-
    NASA Earth Exchange Global Daily Downscaled Projections (NEX-GDDP-CMIP6), version 2.0: daily CMIP6 output,
    bias-corrected and downscaled to 0.25° for 1950 to 2100, 60°S to 90°N. Variables are temperature,
    humidity, precipitation, radiation and wind. This Icechunk store references NASA's public NetCDF files (38
    TB), with one group per model and scenario, such as CESM2/ssp245. There are 35 model groups, two of them
    grids of GFDL-CM4; variables and scenarios differ between models. The code on this page opens ACCESS-CM2;
    change the group name for another model. NASA calls the data provisional.
