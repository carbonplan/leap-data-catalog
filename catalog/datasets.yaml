- id: ldeo-hpd
  title: LDEO-HPD Surface Ocean pCO2
  summary: Observation-based reconstruction of surface ocean pCO2 and air-sea CO2 flux back to 1959.
  description:
    The ocean reduces human impact on the climate by absorbing and sequestering CO2 . From 1950s to the
    1980s, observations of pCO2 and related ocean carbon variables were sparse and uncertain. Thus, global ocean
    biogeochemical models (GOBMs) have been the basis for quantifying the ocean carbon sink. The LDEO-Hybrid Physics
    Data product (LDEO-HPD) interpolates sparse surface ocean pCO2 data to global coverage by using GOBMs as priors,
    and applying machine learning to estimate full-coverage corrections.
  source_url: https://github.com/carbonplan/ocean-carbon-sink-data-feedstock
  license: other
  license_text: CC BY
  providers:
    - name: LDEO
    - name: LEAP
  domain:
    - carbon
    - ocean
  kind:
    - observations
  start: '1959-01-15T00:00:00Z'
  end: '2022-12-15T00:00:00Z'
  bbox:
    - -180.0
    - -89.5
    - 180.0
    - 89.5
  stores:
    - key: monthly
      name: Monthly pCO2 and air-sea flux
      href: s3://carbonplan-data-viewer/demo/leap-data-stories/GCB-2023_dataprod_LDEO-HPD_1959-2022-updated-flipped-lon.zarr
      format: zarr
    - key: annual
      name: Annual pCO2
      href: s3://carbonplan-data-viewer/demo/leap-data-stories/annual-sfco2.zarr
      format: zarr
