- id: caravan-a-global-community-dataset-for-large-sample-hydrology
  title: Caravan - A global community dataset for large-sample hydrology
  description: 'Caravan is an open community dataset of meteorological forcing data, catchment attributes,
    and discharge data for catchments around the world. Additionally, Caravan provides code to derive
    meteorological forcing data and catchment attributes from the same data sources in the cloud, making
    it easy for anyone to extend Caravan to new catchments. The vision of Caravan is to provide the foundation
    for a truly global open source community resource that will grow over time. paper: https://www.nature.com/articles/s41597-023-01975-w
    DOI: https://zenodo.org/records/15529786'
