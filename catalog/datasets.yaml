- id: nasa-rasi
  title: NASA RASI Land Hydrology Projections
  summary: Monthly 0.1° percentiles of soil moisture, runoff and snow for the south-central US, 1950 to 2099.
  description:
    'Monthly land hydrology from NASA RASI (Risk Analysis and Solutions Innovators) on a 0.1° grid over
    the south-central United States and northern Mexico (109.6°W to 96.4°W, 24°N to 39°N). Each variable is stored
    as five percentiles: root zone soil moisture, surface and subsurface runoff, snow water, snow depth and snowfall,
    surface temperature and precipitation. There is one store for the historical period (1950 to 2014) and one each
    for SSP2-4.5 and SSP5-8.5 from 2015. SSP2-4.5 runs to 2099; SSP5-8.5 stops in 2096. The stores reference the
    original files in a public NASA bucket and were made by Development Seed. No paper or technical description
    of the models was found, and some variables have incomplete labels.'
