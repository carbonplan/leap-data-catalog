- id: corrdiff-nyc
  title: CorrDiff NYC Downscaling
  summary: ERA5, HRRR and CorrDiff inputs/outputs for km-scale downscaling over New York City.
  description:
    A collection of atmospheric datasets and model outputs prepared for CorrDiff-based climate downscaling
    experiments over the New York City region. The collection includes ERA5 inputs interpolated to the HRRR grid,
    HRRR reference datasets, CorrDiff model inputs, generated outputs, and target datasets. Data are stored as NetCDF
    files on the Open Storage Network.
  source_url: https://github.com/leap-stc/corrdiff_feedstock
  spatial_domain: New York City
  coverage: regional
  license: Apache-2.0
  providers:
